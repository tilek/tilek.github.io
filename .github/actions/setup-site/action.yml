name: Set up site build
description: Shared toolchain for reproducible Jekyll builds
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.2"
        bundler-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install image and notebook tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes imagemagick
        convert -version
        python -m pip install jupyter==1.1.1
        npm ci
