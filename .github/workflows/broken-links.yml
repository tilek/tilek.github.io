name: Link report (advisory)

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          # External services can reject crawlers; internal output is gated before deploy.
          fail: false
          # removed md files that include liquid tags
          args: --max-retries 3 --exclude '^https://www.youtube-nocookie.com/embed/' --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _posts/2018-12-22-distill.md --verbose --no-progress './**/*.md' './**/*.html'

      - name: Keep link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: lychee/out.md
          if-no-files-found: ignore
      - name: Summarize advisory results
        if: always()
        run: |
          echo "External link results are advisory. Internal generated links and assets must pass before deployment." >> "$GITHUB_STEP_SUMMARY"
          if [ -f lychee/out.md ]; then cat lychee/out.md >> "$GITHUB_STEP_SUMMARY"; fi
